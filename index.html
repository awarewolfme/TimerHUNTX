  if(active)remaining[active]=Math.max(0,teamDeadline-deadline);
 }
 if(who==='main')mainRemaining=0;else remaining[who]=0;
 phase='finished';endedBy=who;deadlineSound=null;active=null;
 $('status').textContent=who==='main'?'Время истекло':'Время '+(who==='green'?'зелёной':'красной')+' команды истекло';$('start').textContent='Новый старт';showCapture();
 setControls();releaseWake();render(deadline);requestClockFit();cancelAnimationFrame(frame);
}
function advance(now=performance.now()){
 if(phase==='preparing'){
  if(now>=startAt){phase='running';$('status').textContent=mode==='flag'?'Идёт отсчёт':'Ожидание захвата';setControls();}
  else {$('status').textContent='Приготовьтесь · '+Math.min(3,Math.ceil((startAt-now)/750));return;}
 }
 if(phase!=='running')return;
 if(!captured&&now>=mainDeadline){finish('main',mainDeadline);return;}
 if(active&&now>=teamDeadline){finish(active,teamDeadline);return;}
}
function loop(){advance();render();if(phase==='preparing'||phase==='running')frame=requestAnimationFrame(loop);}
function startHeartbeat(){if(heartbeat)return;try{const blob=new Blob(['setInterval(()=>postMessage(0),20)'],{type:'application/javascript'});const url=URL.createObjectURL(blob);heartbeat=new Worker(url);URL.revokeObjectURL(url);heartbeat.onmessage=()=>advance();}catch{heartbeat=setInterval(()=>advance(),20);}}
function reset(){
 generation++;phase='idle';cancelAnimationFrame(frame);stopAudio();releaseWake();
 try{durations=values();modeDurations[mode]={...durations};$('error').textContent='';$('timeSettingsError').textContent='';}catch(e){$('error').textContent=e.message;$('timeSettingsError').textContent=e.message;}
 mainRemaining=durations.main;remaining={green:durations.green,red:durations.red};active=null;captured=false;firstTeam=null;lastCapture=null;endedBy=null;seen={green:false,red:false};
 showCapture();$('status').textContent='Готов к старту';$('start').textContent='Старт';setControls();render();requestClockFit();
}
async function start(){
 if(isBusy()||loadingAudioKinds.size>0)return;
 try{durations=values();}catch(e){$('error').textContent=e.message;return;}
 reset();const token=++generation;phase='arming';setControls();$('status').textContent='Включение звука';
 try{await unlockAudio();if(token!==generation)return;}catch(e){if(token!==generation)return;phase='idle';$('status').textContent='Готов к старту';$('error').textContent=e.message;setControls();return;}
 const now=performance.now();const firstBeep=now+100;startAt=firstBeep+PRESTART_MS;mainDeadline=startAt+durations.main;
 startSignals(firstBeep);scheduleEnd(mainDeadline);
 phase='preparing';$('error').textContent='';setControls();keepAwake(token);startHeartbeat();loop();
}
async function togglePause(){
 const now=performance.now();advance(now);
 if(phase==='running'){
  if(!captured)mainRemaining=Math.max(0,mainDeadline-now);
  if(active)remaining[active]=Math.max(0,teamDeadline-now);
  if(lastCapture){lastCapture.elapsed+=now-lastCapture.at;lastCapture.at=now;}
  phase='paused';cancelAnimationFrame(frame);stopAudio();releaseWake();$('status').textContent='Пауза';setControls();render(now);return;
 }
 if(phase!=='paused')return;
 const token=generation;phase='resuming';setControls();
 try{await unlockAudio();if(token!==generation||phase!=='resuming')return;}
 catch(e){if(token!==generation)return;phase='paused';$('error').textContent=e.message;setControls();return;}
 const resumedAt=performance.now();
 if(!captured)mainDeadline=resumedAt+mainRemaining;
 if(active)teamDeadline=resumedAt+remaining[active];
 if(lastCapture)lastCapture.at=resumedAt;
 phase='running';$('error').textContent='';$('status').textContent=captured?'Идёт бой':mode==='flag'?'Идёт отсчёт':'Ожидание захвата';
 scheduleEnd(active?teamDeadline:mainDeadline);setControls();keepAwake(token);startHeartbeat();loop();
}
function capture(team){
 if(mode!=='battle')return;const now=performance.now();advance(now);
 if(phase!=='running'||active===team)return;
 if(active)remaining[active]=Math.max(0,teamDeadline-now);
 // Snapshot at the exact press, before assigning time to the newly selected side.
 lastCapture={at:now,elapsed:0,remaining:{...remaining},seen:{...seen},firstTeamBefore:firstTeam};
 if(!captured){mainRemaining=Math.max(0,mainDeadline-now);captured=true;}
 if(!firstTeam)firstTeam=team;
 active=team;seen[team]=true;teamDeadline=now+remaining[team];scheduleEnd(teamDeadline);dzin();
 showCapture();$('status').textContent='Идёт бой';setControls();render(now);requestClockFit();
}
function correctCapture(){
 const now=performance.now();advance(now);if(mode!=='battle'||!['running','paused'].includes(phase)||!lastCapture||!active)return;
 const corrected=active==='green'?'red':'green',snapshot=lastCapture;
 // Treat the other side as if it was selected at the original press, including
 // all elapsed milliseconds. Repeated corrections toggle the same event.
 const elapsed=snapshot.elapsed+(phase==='running'?now-snapshot.at:0);
 remaining={...snapshot.remaining};remaining[corrected]=Math.max(0,snapshot.remaining[corrected]-elapsed);
 seen={...snapshot.seen,[corrected]:true};firstTeam=snapshot.firstTeamBefore||corrected;active=corrected;
 teamDeadline=now+snapshot.remaining[corrected]-elapsed;cancelDeadline();showCapture();
 // Correction is always silent, including when it reveals an expired timer.
 if(remaining[corrected]===0){finish(corrected,teamDeadline);return;}
 if(phase==='running')scheduleEnd(teamDeadline);
 setControls();render(now);requestClockFit();
}
function chooseMode(next){
 if(!['flag','battle'].includes(next))throw Error('Неизвестный режим');if(isBusy())throw Error('Сначала сбросьте текущую игру');
 try{modeDurations[mode]=values();}catch{modeDurations[mode]={...durations};}
 mode=next;durations={...modeDurations[mode]};
 document.querySelector('.app').dataset.mode=mode;
 for(const key of ['main','green','red']){$(key+'Min').value=String(Math.floor(durations[key]/60000));$(key+'Sec').value=String(Math.floor(durations[key]/1000)%60);}
 modeButtons.forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.mode===mode)));for(const id of ['battleSection','greenSetting','redSetting'])$(id).hidden=mode!=='battle';$('clockLabel').textContent=mode==='flag'?'До конца игры':'До первого захвата';$('mainSettingLabel').textContent=mode==='flag'?'Основной таймер':'До первого захвата';reset();
}
$('openPreferences').addEventListener('click',()=>{renderPreferences();$('preferencesError').textContent='';$('preferencesDialog').showModal();});
$('closePreferences').addEventListener('click',()=>$('preferencesDialog').close());
$('preferencesDialog').addEventListener('close',stopPreview);
$('preferencesDialog').addEventListener('click',event=>{if(event.target===$('preferencesDialog')){const rect=$('preferencesDialog').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)$('preferencesDialog').close();}});
$('swapTeams').addEventListener('click',swapTeams);
for(const [page,id] of [['game','gameSettingsTab'],['sounds','soundSettingsTab']]){
 $(id).addEventListener('click',()=>chooseSettingsPage(page));
 $(id).addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const next=event.key==='Home'?'game':event.key==='End'?'sounds':settingsPage==='game'?'sounds':'game';chooseSettingsPage(next);$(next==='game'?'gameSettingsTab':'soundSettingsTab').focus();}});
}
for(const kind of SOUND_KINDS){
 $(kind+'SoundTab').addEventListener('click',()=>chooseSoundCategory(kind));
 $(kind+'SoundTab').addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const kinds=SOUND_KINDS;let index=kinds.indexOf(soundCategory);index=event.key==='Home'?0:event.key==='End'?kinds.length-1:(index+(event.key==='ArrowRight'?1:kinds.length-1))%kinds.length;chooseSoundCategory(kinds[index]);$(kinds[index]+'SoundTab').focus();}});
 $(kind+'Attach').addEventListener('click',()=>$(kind+'File').click());
 $(kind+'File').addEventListener('change',async()=>{const input=$(kind+'File'),file=input.files?.[0];if(file)await uploadCustomSound(kind,file);input.value='';});
 $(kind+'CustomChoice').addEventListener('click',()=>selectSound(kind,4));
}

for(const kind of SOUND_KINDS)for(let i=0;i<4;i++)$(kind+'Choice'+i).addEventListener('click',()=>selectSound(kind,i));
modeButtons.forEach(el=>el.addEventListener('click',()=>chooseMode(el.dataset.mode)));
$('start').addEventListener('click',start);$('reset').addEventListener('click',reset);$('correct').addEventListener('click',correctCapture);$('pause').addEventListener('click',togglePause);
// Activate on pointer-down to record the capture without waiting for pointer-up.
for(const team of ['green','red']){
 $(team).addEventListener('pointerdown',e=>{if(e.isPrimary&&e.button===0){e.preventDefault();$(team).focus({preventScroll:true});capture(team);}});
 $(team).addEventListener('click',e=>{if(e.detail===0)capture(team);});
 $(team).addEventListener('keydown',e=>{if(!e.repeat&&(e.key===' '||e.key==='Enter')){e.preventDefault();capture(team);}});
}
durationInputs.forEach(el=>el.addEventListener('input',()=>{if(phase==='idle'||phase==='finished')reset();}));
$('soundTest').addEventListener('click',async()=>{if(isBusy())return;const token=generation;try{await unlockAudio();if(token!==generation||isBusy())return;stopAudio();startSignals(performance.now()+100);}catch(e){$('error').textContent=e.message;}});
document.addEventListener('visibilitychange',()=>{advance();render();if(document.visibilityState==='visible'&&(phase==='running'||phase==='preparing')){keepAwake(generation);cancelAnimationFrame(frame);loop();}});
window.addEventListener('pagehide',()=>{releaseWake();if(typeof Worker!=='undefined'&&heartbeat instanceof Worker)heartbeat.terminate();else clearInterval(heartbeat);heartbeat=null;});
window.addEventListener('pageshow',()=>{if(phase==='running'||phase==='preparing'){advance();startHeartbeat();keepAwake(generation);cancelAnimationFrame(frame);loop();}});
// Optional WebMCP: uses the same actions as the controls, with strict validation.
if(document.modelContext?.registerTool){
 const ctx=document.modelContext;
 const register=tool=>{try{Promise.resolve(ctx.registerTool(tool)).catch(()=>{});}catch{}};
 register({name:'read_game_timer',description:'Read the mode, phase and remaining milliseconds of the game timers.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(input){if(!input||Object.keys(input).length)throw Error('Expected an empty object');advance();const now=performance.now();return {mode,phase,active,mainMs:phase==='running'&&!captured?Math.max(0,mainDeadline-now):mainRemaining,greenMs:phase==='running'&&active==='green'?Math.max(0,teamDeadline-now):remaining.green,redMs:phase==='running'&&active==='red'?Math.max(0,teamDeadline-now):remaining.red};}});
 register({name:'capture_game_team',description:'Capture for a team during a running battle, switching the team countdown.',inputSchema:{type:'object',properties:{team:{type:'string',enum:['green','red']}},required:['team'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||Object.keys(input).length!==1||!['green','red'].includes(input.team))throw Error('Expected team green or red');advance();if(mode!=='battle'||phase!=='running')throw Error('A battle must be running');capture(input.team);return {active,phase};}});
}
if(typeof ResizeObserver!=='undefined'){
 const layoutObserver=new ResizeObserver(requestClockFit);
 for(const el of document.querySelectorAll('.app,.clock-area,.team'))layoutObserver.observe(el);
 window.addEventListener('resize',requestClockFit);
 document.fonts?.ready.then(requestClockFit);
}
applyTeamOrder();setControls();render();requestClockFit();void restoreCustomSounds();
</script>
